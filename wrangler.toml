name = "summaaz"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# 内容存储用的 Workers KV。
#
# 二选一：
# A) 在 Cloudflare 后台 Workers & Pages → KV 新建命名空间，把 ID 填到下面并取消注释；
# B) 删除下面这三行，改为在 Pages 项目 Settings → Bindings 里添加 KV 绑定（变量名 CONTENT_KV）。
#
# 注意：ID 必须是真实存在的命名空间，占位符会让部署失败。
# 本地调试可以用 `npx wrangler pages dev dist`（会自动模拟一个本地 KV）。
#
# [[kv_namespaces]]
# binding = "CONTENT_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
NUXT_TELEMETRY_DISABLED = "1"

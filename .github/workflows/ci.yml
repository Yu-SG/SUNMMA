name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build (Nitro)
        run: yarn build
        env:
          NUXT_TELEMETRY_DISABLED: '1'

      - name: Smoke test the production server
        run: |
          node .output/server/index.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/
          curl -sf -o /dev/null http://localhost:3000/admin
          curl -sf -o /dev/null http://localhost:3000/api/content
          kill $SERVER_PID
        env:
          PORT: 3000
          ADMIN_PASSWORD: ci-test-password
          ADMIN_SECRET: ci-test-secret
